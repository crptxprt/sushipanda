<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Stranica nije pronađena | Sushi Panda</title>
    <link rel="icon" type="image/png" href="/favicon-panda.png" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: #171314;
        background:
          radial-gradient(circle at 13% 15%, rgba(255, 73, 40, .13), transparent 23rem),
          radial-gradient(circle at 88% 82%, rgba(255, 216, 195, .72), transparent 27rem),
          #fcfaf8;
        font-family: 'DM Sans', Arial, sans-serif;
      }
      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 28px;
      }
      .page::before, .page::after {
        position: absolute;
        z-index: -1;
        border: 1px solid rgba(255, 70, 45, .17);
        border-radius: 999px;
        content: '';
      }
      .page::before { width: min(76vw, 920px); height: min(76vw, 920px); right: -31vw; top: -41vw; }
      .page::after { width: min(58vw, 720px); height: min(58vw, 720px); left: -27vw; bottom: -34vw; }
      .card {
        width: min(100%, 690px);
        padding: clamp(28px, 5vw, 58px);
        border: 1px solid rgba(28, 20, 18, .1);
        border-radius: 32px;
        background: rgba(255, 255, 255, .78);
        box-shadow: 0 26px 90px rgba(43, 27, 24, .12);
        text-align: center;
        backdrop-filter: blur(16px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #111;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .08em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .brand img { width: 42px; height: 42px; object-fit: contain; }
      .brand span em { color: #ff4a32; font-style: normal; }
      .number { margin: 45px 0 3px; color: #ff4a32; font-size: clamp(5.5rem, 20vw, 10.5rem); font-weight: 700; letter-spacing: -.09em; line-height: .75; }
      h1 { max-width: 520px; margin: 24px auto 0; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.25rem, 6vw, 4.6rem); font-weight: 500; letter-spacing: -.055em; line-height: .95; }
      .copy { max-width: 480px; margin: 22px auto 0; color: #5c5552; font-size: clamp(1rem, 2.2vw, 1.18rem); line-height: 1.58; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 25px; border: 1px solid #181213; border-radius: 999px; color: #fff; background: #181213; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-decoration: none; text-transform: uppercase; transition: transform .2s ease, background .2s ease; }
      .button:hover { transform: translateY(-2px); background: #ff4a32; border-color: #ff4a32; }
      .button--quiet { border-color: rgba(23,19,20,.18); color: #312a29; background: transparent; }
      .button--quiet:hover { color: #fff; }
      .footer { margin-top: 34px; color: #8a807c; font-size: 12px; letter-spacing: .11em; text-transform: uppercase; }
      @media (max-width: 520px) {
        .page { padding: 16px; }
        .card { border-radius: 24px; }
        .number { margin-top: 36px; }
        .actions { flex-direction: column; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <a class="brand" id="home-link" href="/" aria-label="Sushi Panda početna strana">
          <img src="/favicon-panda.png" alt="" />
          <span>Panda <em>Sushi</em></span>
        </a>
        <div class="number" aria-hidden="true">404</div>
        <h1 id="title">Panda nije našla ovu stranicu.</h1>
        <p class="copy" id="copy">Možda je porudžbina otišla na pogrešnu adresu. Vratite se na početnu i nastavljamo dalje.</p>
        <div class="actions">
          <a class="button" id="primary-link" href="/">Nazad na početnu</a>
          <a class="button button--quiet" id="secondary-link" href="https://catering.sushipanda.rs/">Sushi catering</a>
        </div>
        <p class="footer" id="footer">Sushi Panda · Kragujevac · Kraljevo · Jagodina</p>
      </section>
    </main>
    <script>
      (function () {
        var isCatering = window.location.hostname === 'catering.sushipanda.rs';
        if (!isCatering) return;

        document.title = 'Stranica nije pronađena | Sushi Panda Catering';
        document.getElementById('title').textContent = 'Ova postavka je pobegla sa stola.';
        document.getElementById('copy').textContent = 'Stranica koju tražite ne postoji ili je promenila adresu. Vratite se na catering ponudu.';
        document.getElementById('primary-link').textContent = 'Nazad na catering';
        document.getElementById('secondary-link').textContent = 'Sushi Panda dostava';
        document.getElementById('secondary-link').href = 'https://sushipanda.rs/';
        document.getElementById('footer').textContent = 'Sushi Panda Catering · Kragujevac · Kraljevo · Jagodina';
      })();
    </script>
  </body>
</html>
